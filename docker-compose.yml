# ==========================================================================
# 3DS HOME PLATFORM — lokal ishlab chiqish muhiti
# --------------------------------------------------------------------------
# Bitta buyruq bilan ko'tariladi:   npm run db:up
# TZ NFR-OPS-03
# ==========================================================================

services:
  # ------------------------------------------------------------------------
  # PostgreSQL + PostGIS
  # PostGIS majburiy — POI radius va xarita bbox so'rovlari mahsulotning
  # yadrosi (TZ QAROR-1). Oddiy PostgreSQL yetarli emas.
  # ------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: 3ds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-3ds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-3ds_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-3ds_home}
      # uz_UZ locale mavjud emas — C.UTF-8 ishlatiladi, saralash
      # ilova darajasida (Intl.Collator) bajariladi
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-3ds} -d ${POSTGRES_DB:-3ds_home}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------------
  # Redis — sessiya, rate limit, POI keshi
  # ------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: 3ds-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------------
  # MinIO — S3-mos obyekt saqlash (panoramalar og'ir, CDN shart)
  # Konsol: http://localhost:9001
  # ------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: 3ds-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-3ds_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-3ds_minio_local_dev}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
